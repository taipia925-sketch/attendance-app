<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#4f46e5"><title>Attendance</title>
<style>
:root{color-scheme:light;--bg:#f3f4f7;--card:#fff;--ink:#171a21;--mute:#5f6675;--line:#cfd4dc;--accent:#4f46e5;--accent-h:#4338ca;--on:#fff;--soft:rgba(79,70,229,.12);--err:#dc2626}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--bg:#0e1015;--card:#161920;--ink:#eceef2;--mute:#a0a7b4;--line:#363c48;--accent:#8b8cf8;--accent-h:#a5a6fb;--on:#0e1015;--soft:rgba(139,140,248,.16);--err:#f87171}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px}
.box{width:min(400px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:30px 26px;box-shadow:0 10px 30px rgba(16,24,40,.08)}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);display:grid;place-items:center;margin-bottom:16px}
.logo svg{width:22px;height:22px;stroke:var(--on);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1{margin:0 0 4px;font-size:24px}p{margin:0 0 18px;color:var(--mute)}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:var(--on);font:inherit;font-weight:700;cursor:pointer}
button:hover{background:var(--accent-h)}button:disabled{opacity:.6;cursor:progress}
#m{min-height:24px;margin-top:10px;color:var(--err);font-size:14.5px}#m.wait{color:var(--mute)}
</style></head><body>
<form class="box" id="f"><div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M8.5 15l2.3 2.3 4.7-4.6"/></svg></div><h1>Attendance</h1><p>Inserisci il codice per aprire l'app.</p>
<input id="c" type="password" autocomplete="current-password" placeholder="Codice" autofocus>
<button id="b" type="submit">Apri</button><div id="m" role="status"></div></form>
<script id="pl" type="application/octet-stream">@@PAYLOAD@@</script>
<script>
(function(){
  var m=document.getElementById('m'),b=document.getElementById('b'),c=document.getElementById('c');
  /* webapp: installabile sul telefono e utilizzabile anche senza rete */
  if(window.isSecureContext && location.protocol!=='file:'){
    var l=document.createElement('link'); l.rel='manifest'; l.href='manifest.webmanifest'; document.head.appendChild(l);
    var a=document.createElement('link'); a.rel='apple-touch-icon'; a.href='icon-192.png'; document.head.appendChild(a);
    if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  }
  function bytes(s){ var x=atob(s),u=new Uint8Array(x.length); for(var i=0;i<x.length;i++)u[i]=x.charCodeAt(i); return u; }
  async function open(code,silent){
    b.disabled=true; m.className='wait'; m.textContent="Apro l'app…";
    try{
      await new Promise(function(r){ setTimeout(r, 30); });      /* lascio comparire «Apro l'app…» prima del lavoro pesante */
      var d=bytes(document.getElementById('pl').textContent.trim()), salt=d.slice(0,16), iv=d.slice(16,28), ct=d.subarray(28);
      var km=await crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']);
      var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:300000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
      try{localStorage.setItem('att_gate',code);}catch(e){}
      var html=new TextDecoder().decode(pt); document.open(); document.write(html); document.close();
    }catch(e){
      b.disabled=false; m.className=''; m.textContent=silent?'':'Codice non corretto.';
      if(silent){try{localStorage.removeItem('att_gate');}catch(_){}}
    }
  }
  document.getElementById('f').addEventListener('submit',function(ev){ev.preventDefault(); if(c.value) open(c.value.trim(),false);});
  var saved=null; try{saved=localStorage.getItem('att_gate');}catch(e){}
  if(saved) open(saved,true); else m.textContent='';
})();
</script></body></html>
